<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar__logo">Полигон ИИ-агентов</div>

    <div class="navbar__model">
      <label for="modelSelect">Модель</label>
      <select id="modelSelect" class="navbar__select"></select>
    </div>
    <ul class="navbar__links">
      <li><a href="#" class="active">Главная</a></li>
      <li><a href="#">Контакты</a></li>
      <li><a href="#">Настройки</a></li>
    </ul>
  </nav>

  <main class="main">
    <section class="chat">
      <div class="chat__window" id="chatWindow">
        <div class="message message--in">
          Привет! Напиши что-нибудь
          <span class="message__time">--:--</span>
        </div>
      </div>

      <form class="chat__form" id="chatForm">
        <textarea
          class="chat__input"
          id="messageInput"
          name="message"
          rows="1"
          placeholder="Введите сообщение..."
          required></textarea>
        <button type="submit" class="chat__button" id="sendButton">Отправить</button>
      </form>
    </section>
      <aside class="monitor">
      <div class="monitor__head">
        <span>Что происходит с моделью</span>
        <span class="monitor__status" id="monitorStatus">нет связи</span>
      </div>
      <div class="monitor__log" id="monitorLog"></div>
      <button class="monitor__clear" id="monitorClear" type="button">Очистить</button>
    </aside>
  </main>

  <script src = "script.js"></script>
</body>

</html>
